[package]
name = "mylib"
version = "0.1.0"
edition = "2024"
description = "A Rust library"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
